name: Daily Renewable Energy PhD Radar

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        run: python worker.py

      - name: Save results
        run: |
          git config user.name "PhD Radar Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Daily radar update" || exit 0
          git push
