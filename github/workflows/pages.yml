name: Deploy Dashboard on Code Change

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
      - "data/**"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-code-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        run: |
          rm -rf site
          mkdir -p site/reports
          cp index.html style.css app.js site/
          cp reports/*.json reports/*.csv site/reports/
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
