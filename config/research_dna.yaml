  paper2:
    label: "HEFA-SAF strategic planning"
    title: "Planning Australia’s oilseed-based HEFA-SAF supply chain: Cost–emission trade-offs and two-stage stochastic investment planning"
    summary: >-
      Spatial multi-period MILP for Australia's oilseed HEFA-SAF network; Carinata, Camelina and
      constrained Canola; agricultural nodes, candidate biorefineries and airport demand; deterministic
      cost-emission Pareto analysis via epsilon-constraint; two-stage stochastic refinery investment
      under low/base/high demand; lifecycle emissions, land use, logistics and investment timing.
